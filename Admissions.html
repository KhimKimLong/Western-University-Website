<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Western University</title>
</head>
<style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            font-weight: bold;
            justify-content: center; 
            background: darkgray; 
            display:flex ;
            padding: 50px 20px;
          
        }
        form{
            background: white;
            color: #14305a;
            width: 300px;
            padding: 20px;
            border-radius: 8px;
        }
        h2{margin: 0; }
        label{display: block;margin-top: 12px;}
        input{
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
            color: white;
        }
        a{
            display: block;
            width: 95%;
            margin-top: 20px;
            padding: 10px;
            background: #14305a;
            color: white;
            text-align: center;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
<body>
    <form>
        <h2>Welcome </h2>
        <label for="username">Username:</label>
        <input type="text" name="username"/>
        <label for="email">Email::</label>
        <input type="email" name="email"/>
        <label for="pw">Password:</label>
        <input type="password" name="user-pw" id="pw"/>
        <a href="Admissions copy.html">Login</a>
    </form>
</body>
</html>
